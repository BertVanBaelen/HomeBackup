[project]
name = "homebackup"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.120,<0.121", "uvicorn[standard]>=0.30", "croniter>=6", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["homebackup"]

[tool.setuptools.package-data]
homebackup = ["types/*/*.json", "types/*/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
